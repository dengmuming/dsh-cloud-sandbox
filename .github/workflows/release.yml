name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to build (must match package.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      archive: ${{ steps.metadata.outputs.archive }}
      version: ${{ steps.metadata.outputs.version }}
      latest: ${{ steps.channel.outputs.latest }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          cache: true
      - name: Validate source tag
        id: metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const tag = process.env.RELEASE_TAG
          const version = '(0|[1-9][0-9]*)'
          const identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          const semver = new RegExp(`^v${version}\\.${version}\\.${version}(?:-${identifier}(?:\\.${identifier})*)?$`)
          if (!semver.test(tag) || tag !== `v${pkg.version}`) {
            throw new Error(`Tag ${tag} must be v<package.json version> (${pkg.version})`)
          }
          const source = execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim()
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          if (source !== head) throw new Error('Checkout does not match the source tag')
          appendFileSync(process.env.GITHUB_ENV, `PACKAGE_VERSION=${pkg.version}\nARCHIVE=${pkg.name}-${pkg.version}.tgz\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${pkg.version}\narchive=${pkg.name}-${pkg.version}.tgz\n`)
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Pack and verify installable files
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release/$ARCHIVE" -C "$RUNNER_TEMP/package" --strip-components=1
          PACKAGE_DIR="$RUNNER_TEMP/package" node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs'
          import { resolve, relative, isAbsolute } from 'node:path'
          const root = process.env.PACKAGE_DIR
          const pkg = JSON.parse(readFileSync(resolve(root, 'package.json'), 'utf8'))
          const check = (path) => {
            const file = resolve(root, path)
            const local = relative(root, file)
            if (local.startsWith('..') || isAbsolute(local) || !statSync(file).isFile()) {
              throw new Error(`Missing or invalid packaged file: ${path}`)
            }
          }
          const walk = (value) => {
            if (typeof value === 'string') {
              if (value.includes('*')) {
                for (const locale of ['en', 'zh']) check(value.replaceAll('*', locale))
              } else check(value)
            } else for (const item of Object.values(value)) walk(item)
          }
          walk(pkg.exports)
          check(pkg.main)
          check(pkg.types)
          check(pkg.dsh.bundle.patch)
          check(pkg.icon)
          check('Dockerfile')
          check('deploy/setup-public-egress-network.sh')
          console.log(`Verified ${pkg.name}@${pkg.version} with built entry points and bundle assets`)
          NODE
      - name: Determine stable release channel
        id: channel
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const stableVersion = (tag) => /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(tag)?.slice(1).map(BigInt)
          const compare = (left, right) => {
            for (let i = 0; i < 3; i++) {
              if (left[i] !== right[i]) return left[i] > right[i] ? 1 : -1
            }
            return 0
          }
          const candidate = stableVersion(`v${process.env.PACKAGE_VERSION}`)
          let latest = false
          if (candidate) {
            const pages = JSON.parse(execFileSync('gh', [
              'api', '--paginate', '--slurp',
              `repos/${process.env.GITHUB_REPOSITORY}/releases?per_page=100`,
            ], { encoding: 'utf8' }))
            if (!Array.isArray(pages) || !pages.every(Array.isArray)) throw new Error('Invalid GitHub releases response')
            latest = pages.flat().every((release) => {
              if (release.draft || release.prerelease || !release.published_at) return true
              const version = stableVersion(release.tag_name)
              return !version || compare(candidate, version) >= 0
            })
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `latest=${latest}\n`)
          NODE
      - name: Publish GitHub Release
        env:
          LATEST: ${{ steps.channel.outputs.latest }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            flags=(--latest="$LATEST")
            if [[ "$PACKAGE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-npm:
    needs: release
    if: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && needs.release.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      PACKAGE_VERSION: ${{ needs.release.outputs.version }}
      NPM_ARCHIVE: ${{ needs.release.outputs.archive }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Download the verified release package
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$NPM_ARCHIVE" --dir "$RUNNER_TEMP/npm"
      - name: Check existing npm version
        id: npm-version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.version !== process.env.PACKAGE_VERSION) throw new Error('Release version mismatch')
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}?release-check=${Date.now()}`, { headers: { 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(30000) })
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n')
          } else {
            if (!response.ok) throw new Error(`npm version lookup failed: ${response.status}`)
            const existing = await response.json()
            const bytes = readFileSync(join(process.env.RUNNER_TEMP, 'npm', process.env.NPM_ARCHIVE))
            const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`
            if (existing.dist?.integrity !== integrity) throw new Error('Published npm version differs from the GitHub Release package')
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n')
            console.log(`${pkg.name}@${pkg.version} is already published with the same package`)
          }
          NODE
      - name: Publish the release package to npm
        if: ${{ steps.npm-version.outputs.publish == 'true' }}
        run: npm publish "$RUNNER_TEMP/npm/$NPM_ARCHIVE" --access public --registry=https://registry.npmjs.org/
      - name: Verify the public npm release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import { join } from 'node:path'
          import { setTimeout } from 'node:timers/promises'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const archive = readFileSync(join(process.env.RUNNER_TEMP, 'npm', process.env.NPM_ARCHIVE))
          const expected = `sha512-${createHash('sha512').update(archive).digest('base64')}`
          const verificationTimeout = AbortSignal.timeout(300000)
          for (let attempt = 1; attempt <= 60; attempt++) {
            try {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}?release-check=${Date.now()}`, { headers: { 'cache-control': 'no-cache' }, signal: AbortSignal.any([verificationTimeout, AbortSignal.timeout(10000)]) })
              if (!response.ok) throw new Error(`Registry lookup returned ${response.status}`)
              const registry = await response.json()
              const published = registry.versions?.[pkg.version]
              if (!published || registry['dist-tags']?.latest !== pkg.version) throw new Error('Public version or latest tag has not propagated')
              if (published.dist?.integrity !== expected) throw new Error('Public npm integrity differs from the release archive')
              const url = new URL(published.dist.tarball)
              if (url.protocol !== 'https:' || url.hostname !== 'registry.npmjs.org') throw new Error('Unexpected npm tarball host')
              url.searchParams.set('release-check', String(Date.now()))
              const download = await fetch(url, { signal: AbortSignal.any([verificationTimeout, AbortSignal.timeout(10000)]) })
              if (!download.ok) throw new Error(`npm tarball returned ${download.status}`)
              const actual = `sha512-${createHash('sha512').update(Buffer.from(await download.arrayBuffer())).digest('base64')}`
              if (actual !== expected) throw new Error('Downloaded npm archive differs from the GitHub Release')
              console.log(`Verified public ${pkg.name}@${pkg.version}, latest tag, and matching downloadable archive`)
              break
            } catch (error) {
              if (attempt === 60 || verificationTimeout.aborted) throw error
              console.log(`npm verification attempt ${attempt}: ${error.message}; retrying`)
              await setTimeout(5000, undefined, { signal: verificationTimeout })
            }
          }
          NODE
